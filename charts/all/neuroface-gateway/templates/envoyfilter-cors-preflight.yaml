{{/*
  destub-wso2 pattern: Lua OPTIONS 204 WITH CORS headers (priority -10 so
  it runs before Kuadrant WASM). Native cors + empty Lua 204 left unmatched
  paths without ACAO; Swagger reports that as CORS.
*/}}
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: neuroface-gateway-cors-preflight
  namespace: neuroface-gateway-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  priority: -10
  workloadSelector:
    labels:
      gateway.networking.k8s.io/gateway-name: neuroface-gateway
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.router
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.lua.cors_preflight
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            inlineCode: |
{{ include "neuroface-gateway.corsLua" . | nindent 14 }}
