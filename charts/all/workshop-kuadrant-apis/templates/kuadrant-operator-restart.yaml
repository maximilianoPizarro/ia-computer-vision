# Waits for Kuadrant CR Ready after Istio GatewayClass exists. Does NOT restart
# the Kuadrant operator -- neuroface-gateway's kuadrant-operator-readiness PostSync
# Job owns the cluster-wide operator restart + AuthPolicy Accepted verification.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kuadrant-operator-restart
  namespace: {{ .Values.workshopGateway.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kuadrant-operator-restart
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gatewayclasses"]
    verbs: ["get", "list"]
  - apiGroups: ["kuadrant.io"]
    resources: ["kuadrants", "authpolicies"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kuadrant-operator-restart
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kuadrant-operator-restart
subjects:
  - kind: ServiceAccount
    name: kuadrant-operator-restart
    namespace: {{ .Values.workshopGateway.namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kuadrant-operator-restart-hook
  namespace: {{ .Values.workshopGateway.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: Never
      serviceAccountName: kuadrant-operator-restart
      containers:
        - name: wait-ready
          image: {{ .Values.kuadrantOperatorRestart.image | default "registry.redhat.io/openshift4/ose-cli:latest" | quote }}
          command:
            - /bin/bash
            - -ec
            - |
              set -euo pipefail

              count_invalid_authpolicies() {
                if command -v jq >/dev/null 2>&1; then
                  oc get authpolicy -A -o json 2>/dev/null | jq '[.items[] | select((.status.conditions // []) | map(select(.type=="Accepted")) | .[0].status != "True")] | length'
                else
                  oc get authpolicy -A -o json 2>/dev/null | python3 -c 'import json,sys;d=json.load(sys.stdin);print(sum(1 for i in d.get("items",[]) if next((c for c in (i.get("status") or {}).get("conditions") or [] if c.get("type")=="Accepted"),{}).get("status")!="True"))'
                fi
              }

              echo "Waiting for GatewayClass istio (Istio mesh ready)..."
              for i in $(seq 1 60); do
                if oc get gatewayclass istio -o jsonpath='{.status.conditions[?(@.type=="Accepted")].status}' 2>/dev/null | grep -qx True; then
                  echo "GatewayClass istio is Accepted"
                  break
                fi
                if [ "$i" -eq 60 ]; then
                  echo "WARN: GatewayClass istio not Accepted after 10 minutes"
                fi
                sleep 10
              done

              TOTAL=$(oc get authpolicy -A --no-headers 2>/dev/null | wc -l | tr -d ' ')
              if [ "${TOTAL:-0}" -gt 0 ]; then
                INVALID=$(count_invalid_authpolicies 2>/dev/null || echo "999")
                INVALID=$(echo "$INVALID" | tr -d '[:space:]')
                if [ "$INVALID" = "0" ]; then
                  echo "All $TOTAL AuthPolicy resource(s) already Accepted -- skipping operator restart (handled by neuroface-gateway readiness Job when needed)."
                else
                  echo "WARN: $INVALID/$TOTAL AuthPolicy(ies) not Accepted -- neuroface-gateway kuadrant-operator-readiness Job will restart the operator."
                fi
              else
                echo "No AuthPolicy resources yet (neuroface-gateway may still be syncing)."
              fi

              echo "Waiting for Kuadrant CR Ready..."
              for i in $(seq 1 36); do
                ready=$(oc get kuadrant kuadrant -n kuadrant-system -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || true)
                if [[ "$ready" == "True" ]]; then
                  echo "Kuadrant Ready"
                  exit 0
                fi
                sleep 10
              done
              echo "WARN: Kuadrant CR not Ready after 6 minutes"
              exit 0
