{{- /* No `| default true`: Sprig's default() treats boolean false as
       empty and silently replaces it with the fallback, making an
       explicit pluginReadiness.enabled=false override a no-op. This
       chart's own values.yaml already defaults it to true. */ -}}
{{- if .Values.pluginReadiness.enabled }}
# Backstage caches a failed Issuer.discover() for the life of the process.
# If the first /oidc/start runs while sso still points at the catalog Keycloak
# (no realm "backstage"), every later login stays "Realm does not exist"
# even after discovery returns 200. Bounce the pods once discovery is healthy.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: developer-hub-keycloak-readiness
  namespace: developer-hub
  annotations:
    argocd.argoproj.io/sync-wave: "3"
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developer-hub-keycloak-readiness
  namespace: developer-hub
  annotations:
    argocd.argoproj.io/sync-wave: "3"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: developer-hub-keycloak-readiness
subjects:
  - kind: ServiceAccount
    name: developer-hub
    namespace: developer-hub
---
# OpenTLC / RHOAI catalog installs a Keycloak in namespace "keycloak" that
# claims sso.<domain> before this pattern. That instance has no realm
# backstage, so Developer Hub OIDC stays "Realm does not exist" and the
# pattern Ingress stays HostAlreadyClaimed. This only runs when that CR exists.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: developer-hub-keycloak-readiness
  annotations:
    argocd.argoproj.io/sync-wave: "3"
rules:
  - apiGroups: ["k8s.keycloak.org"]
    resources: ["keycloaks"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: developer-hub-keycloak-readiness
  annotations:
    argocd.argoproj.io/sync-wave: "3"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: developer-hub-keycloak-readiness
subjects:
  - kind: ServiceAccount
    name: developer-hub
    namespace: developer-hub
---
apiVersion: batch/v1
kind: Job
metadata:
  name: developer-hub-keycloak-readiness
  namespace: developer-hub
  annotations:
    # After backstage-realm KeycloakRealmImport (sync-wave 5).
    argocd.argoproj.io/sync-wave: "6"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 1200
  template:
    spec:
      serviceAccountName: developer-hub
      restartPolicy: OnFailure
      containers:
        - name: wait
          # ose-cli: the catalog-Keycloak move below needs `oc`. ubi-minimal does not ship it.
          image: registry.redhat.io/openshift4/ose-cli:latest
          env:
            - name: KEYCLOAK_NS
              value: {{ include "developer-hub.keycloakNamespace" . | quote }}
            - name: SSO_URL
              value: {{ include "developer-hub.ssoBaseUrl" . | quote }}
            - name: OIDC_DISCOVERY
              value: {{ include "developer-hub.oidcDiscoveryUrl" . | quote }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              SSO_HOST="${SSO_URL#https://}"
              SSO_HOST="${SSO_HOST%%/*}"
              APPS_DOMAIN="${SSO_HOST#sso.}"
              ALT_HOST="sandbox-sso.${APPS_DOMAIN}"
              if oc get keycloak.k8s.keycloak.org keycloak -n keycloak >/dev/null 2>&1; then
                CUR="$(oc get keycloak.k8s.keycloak.org keycloak -n keycloak -o jsonpath='{.spec.hostname.hostname}')"
                if [ "${CUR}" = "${SSO_HOST}" ]; then
                  echo "Catalog Keycloak owns ${SSO_HOST}; moving it to ${ALT_HOST}"
                  oc patch keycloak.k8s.keycloak.org keycloak -n keycloak --type merge \
                    -p "{\"spec\":{\"hostname\":{\"hostname\":\"${ALT_HOST}\"}}}"
                  oc delete route keycloak -n keycloak --ignore-not-found
                  oc get route -n keycloak-system -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.spec.host}{" "}{.status.ingress[0].conditions[0].reason}{"\n"}{end}' \
                    | while read -r name host reason; do
                        if [ "${host}" = "${SSO_HOST}" ] && [ "${reason}" = "HostAlreadyClaimed" ]; then
                          oc delete route "${name}" -n keycloak-system --ignore-not-found --wait=false
                        fi
                      done
                else
                  echo "Catalog Keycloak hostname is ${CUR:-<empty>}; leaving it"
                fi
              else
                echo "No catalog Keycloak in namespace keycloak"
              fi

              echo "Waiting for SSO route ${SSO_URL}..."
              for i in $(seq 1 90); do
                CODE=$(curl -sk -o /dev/null -w "%{http_code}" "${SSO_URL}/" || echo "000")
                if [ "${CODE}" = "200" ] || [ "${CODE}" = "302" ] || [ "${CODE}" = "303" ]; then
                  echo "SSO route reachable (HTTP ${CODE})"
                  break
                fi
                if [ "$i" -eq 90 ]; then
                  echo "SSO route not reachable (last HTTP ${CODE})"
                  exit 1
                fi
                sleep 10
              done

              echo "Waiting for backstage realm OIDC discovery..."
              for i in $(seq 1 60); do
                CODE=$(curl -sk -o /dev/null -w "%{http_code}" "${OIDC_DISCOVERY}" || echo "000")
                if [ "${CODE}" = "200" ]; then
                  echo "OIDC discovery OK"
                  TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
                  NS="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)"
                  DEL="$(curl -sk -o /tmp/dh-restart.json -w "%{http_code}" -X DELETE \
                    -H "Authorization: Bearer ${TOKEN}" \
                    "https://kubernetes.default.svc/api/v1/namespaces/${NS}/pods?labelSelector=rhdh.redhat.com%2Fapp%3Dbackstage-developer-hub" \
                    || echo "000")"
                  echo "Restarted Developer Hub pods (HTTP ${DEL})"
                  if [ "${DEL}" != "200" ]; then
                    exit 1
                  fi
                  exit 0
                fi
                if [ "$i" -eq 60 ]; then
                  echo "OIDC discovery not ready (last HTTP ${CODE})"
                  exit 1
                fi
                sleep 10
              done
{{- end }}
