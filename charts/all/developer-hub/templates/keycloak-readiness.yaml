{{- /* No `| default true`: Sprig's default() treats boolean false as
       empty and silently replaces it with the fallback, making an
       explicit pluginReadiness.enabled=false override a no-op. This
       chart's own values.yaml already defaults it to true. */ -}}
{{- if .Values.pluginReadiness.enabled }}
# Backstage caches a failed Issuer.discover() for the life of the process.
# If the first /oidc/start runs while sso still points at the catalog Keycloak
# (no realm "backstage"), every later login stays "Realm does not exist"
# even after discovery returns 200. Bounce the pods once discovery is healthy.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: developer-hub-keycloak-readiness
  namespace: developer-hub
  annotations:
    argocd.argoproj.io/sync-wave: "3"
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developer-hub-keycloak-readiness
  namespace: developer-hub
  annotations:
    argocd.argoproj.io/sync-wave: "3"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: developer-hub-keycloak-readiness
subjects:
  - kind: ServiceAccount
    name: developer-hub
    namespace: developer-hub
---
apiVersion: batch/v1
kind: Job
metadata:
  name: developer-hub-keycloak-readiness
  namespace: developer-hub
  annotations:
    # After backstage-realm KeycloakRealmImport (sync-wave 5).
    argocd.argoproj.io/sync-wave: "6"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 1200
  template:
    spec:
      serviceAccountName: developer-hub
      restartPolicy: OnFailure
      containers:
        - name: wait
          image: {{ .Values.pluginReadiness.image | default "registry.redhat.io/ubi9/ubi-minimal:latest" | quote }}
          env:
            - name: KEYCLOAK_NS
              value: {{ include "developer-hub.keycloakNamespace" . | quote }}
            - name: SSO_URL
              value: {{ include "developer-hub.ssoBaseUrl" . | quote }}
            - name: OIDC_DISCOVERY
              value: {{ include "developer-hub.oidcDiscoveryUrl" . | quote }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              echo "Waiting for SSO route ${SSO_URL}..."
              for i in $(seq 1 90); do
                CODE=$(curl -sk -o /dev/null -w "%{http_code}" "${SSO_URL}/" || echo "000")
                if [ "${CODE}" = "200" ] || [ "${CODE}" = "302" ] || [ "${CODE}" = "303" ]; then
                  echo "SSO route reachable (HTTP ${CODE})"
                  break
                fi
                if [ "$i" -eq 90 ]; then
                  echo "SSO route not reachable (last HTTP ${CODE})"
                  exit 1
                fi
                sleep 10
              done

              echo "Waiting for backstage realm OIDC discovery..."
              for i in $(seq 1 60); do
                CODE=$(curl -sk -o /dev/null -w "%{http_code}" "${OIDC_DISCOVERY}" || echo "000")
                if [ "${CODE}" = "200" ]; then
                  echo "OIDC discovery OK"
                  TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
                  NS="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)"
                  DEL="$(curl -sk -o /tmp/dh-restart.json -w "%{http_code}" -X DELETE \
                    -H "Authorization: Bearer ${TOKEN}" \
                    "https://kubernetes.default.svc/api/v1/namespaces/${NS}/pods?labelSelector=rhdh.redhat.com%2Fapp%3Dbackstage-developer-hub" \
                    || echo "000")"
                  echo "Restarted Developer Hub pods (HTTP ${DEL})"
                  if [ "${DEL}" != "200" ]; then
                    exit 1
                  fi
                  exit 0
                fi
                if [ "$i" -eq 60 ]; then
                  echo "OIDC discovery not ready (last HTTP ${CODE})"
                  exit 1
                fi
                sleep 10
              done
{{- end }}
