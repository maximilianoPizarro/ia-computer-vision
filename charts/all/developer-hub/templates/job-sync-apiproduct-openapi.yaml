# OpenShift Connectivity Link DevPortal reads APIProduct.status.openapi.raw for the
# "Definition" tab Swagger view. Backstage catalog /definition URLs return HTML (SPA
# shell), so we embed the same OpenAPI fragments used by Developer Hub and patch status
# after each developer-hub sync and on a CronJob so the tab does not stay empty if
# the PostSync hook is skipped.
#
# SA / ClusterRole / ClusterRoleBinding are persistent (not PostSync hooks) so the
# CronJob can keep using them after the Job hook is deleted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: developer-hub-sync-apiproduct-openapi
  namespace: developer-hub
  annotations:
    argocd.argoproj.io/sync-wave: "11"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: developer-hub-sync-apiproduct-openapi
  annotations:
    argocd.argoproj.io/sync-wave: "11"
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
  - apiGroups: ["devportal.kuadrant.io"]
    resources: ["apiproducts"]
    verbs: ["get", "list"]
  - apiGroups: ["devportal.kuadrant.io"]
    resources: ["apiproducts/status"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: developer-hub-sync-apiproduct-openapi
  annotations:
    argocd.argoproj.io/sync-wave: "11"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: developer-hub-sync-apiproduct-openapi
subjects:
  - kind: ServiceAccount
    name: developer-hub-sync-apiproduct-openapi
    namespace: developer-hub
---
apiVersion: batch/v1
kind: Job
metadata:
  name: developer-hub-sync-apiproduct-openapi
  namespace: developer-hub
  annotations:
    argocd.argoproj.io/sync-wave: "11"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: developer-hub-sync-apiproduct-openapi
      containers:
        - name: sync
          image: registry.redhat.io/openshift4/ose-cli:latest
          command:
            - /bin/bash
            - -ec
            - |
{{ include "developer-hub.syncApiProductOpenapiScript" . | indent 14 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: developer-hub-sync-apiproduct-openapi
  namespace: developer-hub
  annotations:
    argocd.argoproj.io/sync-wave: "11"
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 600
      activeDeadlineSeconds: 180
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: developer-hub-sync-apiproduct-openapi
          containers:
            - name: sync
              image: registry.redhat.io/openshift4/ose-cli:latest
              command:
                - /bin/bash
                - -ec
                - |
{{ include "developer-hub.syncApiProductOpenapiScript" . | indent 18 }}
